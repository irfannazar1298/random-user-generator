<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="exam2.js" defer></script>
</head>
<body>
  <main class="container py-5">
    <h1 class="text-center mb-3">Random User Generator</h1>
    <p class="text-center text-secondary mb-4">Choose how many profiles you want to generate.</p>

    <form id="user-form" class="row g-3 justify-content-center align-items-end mb-4">
      <div class="col-12 col-sm-auto">
        <label for="user-count" class="form-label">Number of users</label>
        <input id="user-count" class="form-control" type="number" min="1" step="1" value="1" required>
      </div>
      <div class="col-12 col-sm-auto">
        <button id="generate-button" class="btn btn-primary w-100" type="submit">Generate Users</button>
      </div>
    </form>

    <p id="message" class="text-center" aria-live="polite"></p>
    <section id="user-list" class="row g-3" aria-label="Random user profiles"></section>
  </main>
</body>
</html>
